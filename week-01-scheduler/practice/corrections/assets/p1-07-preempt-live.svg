<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --code-bg: #f1efe9; --warn: #a3431b; --rt: #b9b6ad;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --code-bg: #22211f; --warn: #ef8a5c; --rt: #5d5b56;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 15px; }
.diagram .lbl { fill: var(--muted); font-size: 13px; }
.diagram .ttl { fill: var(--accent); font-size: 17px; font-weight: 700; }
.diagram .row { fill: var(--code-bg); }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
.diagram .task { fill: var(--accent); }
.diagram .main { fill: var(--warn); }
.diagram .rt { fill: var(--rt); }
.diagram .idle { fill: var(--warn); opacity: 0.18; }
.diagram .mark { stroke: var(--fg); stroke-width: 2; }
.diagram .mt { fill: var(--fg); font-size: 12px; font-weight: 600; }
.diagram .gid { fill: var(--bg); font-size: 12px; font-weight: 600; }
.diagram .pre { fill: var(--warn); stroke: var(--bg); stroke-width: 1; }
</style>
