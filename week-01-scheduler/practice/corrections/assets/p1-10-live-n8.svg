.diagram .gid { fill: var(--bg); font-size: 12px; font-weight: 600; }
.diagram .pre { fill: var(--warn); stroke: var(--bg); stroke-width: 1; }
.diagram .wait { fill: none; stroke: var(--warn); stroke-width: 2; }
.diagram .free { fill: url(#hatch); }
.diagram .hl { stroke: var(--warn); stroke-width: 2; }
.diagram .steal { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 3 2; }
.diagram .sh { fill: var(--fg); }
