<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 960 488" width="960" height="488" role="img" aria-label="При росте N горутины почти не дорожают, select дорожает до 17 раз при 128 входах, reflect.Select еще вдвое медленнее; так при -cpu 1, 2 и 8">
<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --gor: #2a78d6; --sel: #eb6834; --ref: #1baf7a; --ctl: #8a877f;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --gor: #3987e5; --sel: #d95926; --ref: #199e70; --ctl: #8a877f;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 15px; }
.diagram .lbl { fill: var(--muted); font-size: 13px; }
.diagram .ttl { fill: var(--accent); font-size: 17px; font-weight: 700; }
.diagram .sub { font-size: 15px; font-weight: 700; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
.diagram .l-gor { stroke: var(--gor); stroke-width: 2; fill: none; }
.diagram .l-sel { stroke: var(--sel); stroke-width: 2; fill: none; }
.diagram .l-ref { stroke: var(--ref); stroke-width: 2; fill: none; }
.diagram .l-ctl { stroke: var(--ctl); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
.diagram .m-gor { fill: var(--gor); stroke: var(--bg); stroke-width: 2; }
.diagram .m-sel { fill: var(--sel); stroke: var(--bg); stroke-width: 2; }
.diagram .m-ref { fill: var(--ref); stroke: var(--bg); stroke-width: 2; }
.diagram .m-ctl { fill: var(--ctl); stroke: var(--bg); stroke-width: 2; }
</style>
