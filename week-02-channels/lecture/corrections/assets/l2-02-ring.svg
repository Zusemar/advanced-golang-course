<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="-16 -16 992 834" width="992" height="834" role="img" aria-label="make(chan int, 4) in two states. Full: qcount 4, sendx and recvx 1, slots hold copies v5 v2 v3 v4; recvq is empty; sendq holds two sudogs, for G7 and G9, linked by next, whose elem points at v6 and v7 on their own stacks. Empty: qcount 0, no values in the slots; recvq holds one sudog for G3 whose elem points at x on G3 stack; sendq is empty. All of it changes only under c.lock.">
<defs><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahfg" d="M0 0L10 5L0 10z"/></marker><marker id="ah-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahac" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --code-bg: #f1efe9; --warn: #a3431b;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --code-bg: #22211f; --warn: #ef8a5c;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 16px; }
.diagram .lbl { fill: var(--muted); font-size: 14.5px; }
.diagram .ttl { fill: var(--accent); font-size: 18px; font-weight: 700; }
.diagram .val { font-size: 20px; font-weight: 700; }
.diagram .big { font-size: 19px; font-weight: 600; }
.diagram .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14.5px; }
.diagram .area { fill: var(--code-bg); stroke: var(--rule); stroke-width: 2; }
.diagram .cell { fill: var(--bg); stroke: var(--rule); stroke-width: 2; }
.diagram .pbox { fill: var(--code-bg); stroke: var(--accent); stroke-width: 3; }
.diagram .sg { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
.diagram .sgt { fill: var(--accent); font-size: 14.5px; font-weight: 700; }
.diagram .stk { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 5 4; }
.diagram .empty { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.diagram .arrow { stroke: var(--fg); stroke-width: 2.2; fill: none; marker-end: url(#ah-fg); }
.diagram .arrow.a { stroke: var(--accent); marker-end: url(#ah-ac); }
.diagram .ahfg { fill: var(--fg); }
.diagram .ahac { fill: var(--accent); }
</style>
