<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="-24 -24 1184 568" width="1184" height="568" role="img" aria-label="Two Ps, each with an M, a running G, a runnext slot and a 256-slot local ring; a global run queue behind one lock; parked Gs in no queue; idle Ms without a P; sysmon on its own M without a P.">
<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --code-bg: #f1efe9; --mark: #ffe58a;
  --cue-bg: #1d1d1b; --cue-fg: #fbfaf7; --warn: #a3431b;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --code-bg: #22211f; --mark: #6b5a12;
  --cue-bg: #ecebe6; --cue-fg: #161615; --warn: #ef8a5c;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 19px; }
.diagram .lbl { fill: var(--muted); font-size: 16px; }
.diagram .ttl { fill: var(--accent); font-size: 22px; font-weight: 700; }
.diagram .big { font-size: 20px; font-weight: 600; }
.diagram .pbox { fill: var(--code-bg); stroke: var(--accent); stroke-width: 3; }
.diagram .area { fill: var(--code-bg); stroke: var(--rule); stroke-width: 2; }
.diagram .kern { fill: var(--code-bg); stroke: var(--warn); stroke-width: 2; stroke-dasharray: 8 6; }
.diagram .m { fill: var(--bg); stroke: var(--fg); stroke-width: 2.5; }
.diagram .m.idle { stroke: var(--muted); stroke-dasharray: 6 5; }
.diagram .m.sys { stroke: var(--warn); stroke-width: 3; }
.diagram .mt { font-size: 22px; font-weight: 700; }
.diagram .cell { fill: var(--bg); stroke: var(--rule); stroke-width: 2; }
.diagram .g { fill: var(--accent); }
.diagram .gt { fill: var(--bg); font-size: 16px; font-weight: 700; }
.diagram .gq { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
.diagram .gqt { fill: var(--accent); font-size: 15px; font-weight: 700; }
.diagram .gp { fill: var(--bg); stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; }
.diagram .gpt { fill: var(--muted); font-size: 15px; font-weight: 700; }
.diagram .link { stroke: var(--fg); stroke-width: 2.5; fill: none; }
.diagram .arrow { stroke: var(--fg); stroke-width: 2.5; fill: none; marker-end: url(#ah-fg); }
.diagram .arrow.w { stroke: var(--warn); marker-end: url(#ah-warn); }
.diagram .arrow.d { stroke-dasharray: 7 6; }
.diagram .ahfg { fill: var(--fg); }
.diagram .ahw { fill: var(--warn); }
.diagram .wt { fill: var(--warn); font-weight: 600; }
.diagram .bad { fill: var(--warn); opacity: 0.22; }
.diagram .badl { stroke: var(--warn); stroke-width: 3; fill: none; }
.diagram .ok { fill: var(--accent); opacity: 0.85; }
.diagram .grey { stroke: var(--muted); }
.diagram .num { fill: var(--fg); }
.diagram .numt { fill: var(--bg); font-size: 16px; font-weight: 700; }
.diagram .numg { fill: var(--muted); }
.diagram .step { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
.diagram .step.w { stroke: var(--warn); }
.diagram .sm { font-size: 17px; }
.diagram .gn { fill: var(--warn); }
</style>
<title>G, M, P as a picture</title>
<rect class="bgr" x="-24" y="-24" width="1184" height="568" rx="12"/>
<defs><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahfg" d="M0 0L10 5L0 10z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0 0L10 5L0 10z"/></marker></defs>
<g><rect class="pbox" x="0" y="0" width="540" height="232" rx="10"/><text class="ttl" x="18" y="32" text-anchor="start">P0</text><text class="lbl" x="70" y="32" text-anchor="start">a P: permit to run user Go code</text></g>
<g><rect class="m" x="20" y="52" width="86" height="64" rx="6"/><text class="mt" x="63.0" y="81" text-anchor="middle">M</text><text class="lbl" x="63.0" y="103" text-anchor="middle">thread</text><line class="link" x1="106" y1="84" x2="150" y2="84"/></g>
<g><circle class="g" cx="172" cy="84" r="20"/><text class="gt" x="172" y="89.5" text-anchor="middle">G</text></g><g><text class="lbl" x="172" y="128" text-anchor="middle">running</text></g>
<g><rect class="cell" x="250" y="58" width="52" height="52" rx="6"/><circle class="gq" cx="276" cy="84" r="17"/><text class="gqt" x="276" y="89" text-anchor="middle">G</text><text class="lbl" x="276" y="128" text-anchor="middle"><tspan font-family="JetBrains Mono, Fira Code, Cascadia Mono, Menlo, Consolas, monospace">runnext</tspan></text><text class="lbl" x="330" y="80" text-anchor="start">next to run,</text><text class="lbl" x="330" y="100" text-anchor="start">one slot</text><text class="lbl" x="20" y="168" text-anchor="start">local run queue: a ring of 256 slots, no lock</text><rect class="cell" x="20" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="36" cy="198" r="12"/><text class="gqt" x="36" y="203" text-anchor="middle"></text><rect class="cell" x="54" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="70" cy="198" r="12"/><text class="gqt" x="70" y="203" text-anchor="middle"></text><rect class="cell" x="88" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="104" cy="198" r="12"/><text class="gqt" x="104" y="203" text-anchor="middle"></text><rect class="cell" x="122" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="138" cy="198" r="12"/><text class="gqt" x="138" y="203" text-anchor="middle"></text><rect class="cell" x="156" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="172" cy="198" r="12"/><text class="gqt" x="172" y="203" text-anchor="middle"></text><rect class="cell" x="190" y="180" width="32" height="36" rx="4"/><rect class="cell" x="224" y="180" width="32" height="36" rx="4"/><rect class="cell" x="258" y="180" width="32" height="36" rx="4"/><rect class="cell" x="292" y="180" width="32" height="36" rx="4"/><rect class="cell" x="326" y="180" width="32" height="36" rx="4"/><rect class="cell" x="360" y="180" width="32" height="36" rx="4"/><rect class="cell" x="394" y="180" width="32" height="36" rx="4"/><rect class="cell" x="428" y="180" width="32" height="36" rx="4"/><text class="lbl" x="470" y="205" text-anchor="start">… 256</text><rect class="pbox" x="596" y="0" width="540" height="232" rx="10"/><text class="ttl" x="614" y="32" text-anchor="start">P1</text><text class="lbl" x="666" y="32" text-anchor="start">a P: permit to run user Go code</text></g>
<g><rect class="m" x="616" y="52" width="86" height="64" rx="6"/><text class="mt" x="659.0" y="81" text-anchor="middle">M</text><text class="lbl" x="659.0" y="103" text-anchor="middle">thread</text><line class="link" x1="702" y1="84" x2="746" y2="84"/></g>
<g><circle class="g" cx="768" cy="84" r="20"/><text class="gt" x="768" y="89.5" text-anchor="middle">G</text></g><g><text class="lbl" x="768" y="128" text-anchor="middle">running</text></g>
<g><rect class="cell" x="846" y="58" width="52" height="52" rx="6"/><circle class="gq" cx="872" cy="84" r="17"/><text class="gqt" x="872" y="89" text-anchor="middle">G</text><text class="lbl" x="872" y="128" text-anchor="middle"><tspan font-family="JetBrains Mono, Fira Code, Cascadia Mono, Menlo, Consolas, monospace">runnext</tspan></text><text class="lbl" x="926" y="80" text-anchor="start">next to run,</text><text class="lbl" x="926" y="100" text-anchor="start">one slot</text><text class="lbl" x="616" y="168" text-anchor="start">local run queue: a ring of 256 slots, no lock</text><rect class="cell" x="616" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="632" cy="198" r="12"/><text class="gqt" x="632" y="203" text-anchor="middle"></text><rect class="cell" x="650" y="180" width="32" height="36" rx="4"/><circle class="gq" cx="666" cy="198" r="12"/><text class="gqt" x="666" y="203" text-anchor="middle"></text><rect class="cell" x="684" y="180" width="32" height="36" rx="4"/><rect class="cell" x="718" y="180" width="32" height="36" rx="4"/><rect class="cell" x="752" y="180" width="32" height="36" rx="4"/><rect class="cell" x="786" y="180" width="32" height="36" rx="4"/><rect class="cell" x="820" y="180" width="32" height="36" rx="4"/><rect class="cell" x="854" y="180" width="32" height="36" rx="4"/><rect class="cell" x="888" y="180" width="32" height="36" rx="4"/><rect class="cell" x="922" y="180" width="32" height="36" rx="4"/><rect class="cell" x="956" y="180" width="32" height="36" rx="4"/><rect class="cell" x="990" y="180" width="32" height="36" rx="4"/><rect class="cell" x="1024" y="180" width="32" height="36" rx="4"/><text class="lbl" x="1066" y="205" text-anchor="start">… 256</text></g>
<g><rect class="area" x="0" y="262" width="1136" height="62" rx="8"/><text class="big" x="18" y="290" text-anchor="start">global run queue</text><text class="lbl" x="18" y="312" text-anchor="start">outside every P, behind one lock (<tspan font-family="JetBrains Mono, Fira Code, Cascadia Mono, Menlo, Consolas, monospace">sched.lock</tspan>)</text><circle class="gq" cx="560" cy="293" r="15"/><text class="gqt" x="560" y="298" text-anchor="middle">G</text><circle class="gq" cx="606" cy="293" r="15"/><text class="gqt" x="606" y="298" text-anchor="middle">G</text><circle class="gq" cx="652" cy="293" r="15"/><text class="gqt" x="652" y="298" text-anchor="middle">G</text><circle class="gq" cx="698" cy="293" r="15"/><text class="gqt" x="698" y="298" text-anchor="middle">G</text><circle class="gq" cx="744" cy="293" r="15"/><text class="gqt" x="744" y="298" text-anchor="middle">G</text><circle class="gq" cx="790" cy="293" r="15"/><text class="gqt" x="790" y="298" text-anchor="middle">G</text><circle class="gq" cx="836" cy="293" r="15"/><text class="gqt" x="836" y="298" text-anchor="middle">G</text><circle class="gq" cx="882" cy="293" r="15"/><text class="gqt" x="882" y="298" text-anchor="middle">G</text><circle class="gq" cx="928" cy="293" r="15"/><text class="gqt" x="928" y="298" text-anchor="middle">G</text><circle class="gq" cx="974" cy="293" r="15"/><text class="gqt" x="974" y="298" text-anchor="middle">G</text><circle class="gq" cx="1020" cy="293" r="15"/><text class="gqt" x="1020" y="298" text-anchor="middle">G</text><circle class="gq" cx="1066" cy="293" r="15"/><text class="gqt" x="1066" y="298" text-anchor="middle">G</text><text class="big" x="0" y="372" text-anchor="start">parked Gs: in no run queue</text><text class="lbl" x="0" y="394" text-anchor="start">waiting on a channel, a mutex or the netpoller</text><circle class="gp" cx="24" cy="436" r="17"/><text class="gpt" x="24" y="441" text-anchor="middle">G</text><circle class="gp" cx="74" cy="436" r="17"/><text class="gpt" x="74" y="441" text-anchor="middle">G</text><circle class="gp" cx="124" cy="436" r="17"/><text class="gpt" x="124" y="441" text-anchor="middle">G</text><circle class="gp" cx="174" cy="436" r="17"/><text class="gpt" x="174" y="441" text-anchor="middle">G</text><circle class="gp" cx="224" cy="436" r="17"/><text class="gpt" x="224" y="441" text-anchor="middle">G</text><circle class="gp" cx="274" cy="436" r="17"/><text class="gpt" x="274" y="441" text-anchor="middle">G</text></g>
<g><text class="big" x="440" y="372" text-anchor="start">idle Ms</text><text class="lbl" x="440" y="394" text-anchor="start">threads with no P, parked</text><rect class="m idle" x="440" y="412" width="86" height="64" rx="6"/><text class="mt" x="483.0" y="441" text-anchor="middle">M</text><text class="lbl" x="483.0" y="463" text-anchor="middle">thread</text><rect class="m idle" x="540" y="412" width="86" height="64" rx="6"/><text class="mt" x="583.0" y="441" text-anchor="middle">M</text><text class="lbl" x="583.0" y="463" text-anchor="middle">thread</text><text class="big" x="760" y="372" text-anchor="start">sysmon</text><text class="lbl" x="760" y="394" text-anchor="start">its own M, never holds a P</text><rect class="m sys" x="760" y="412" width="110" height="64" rx="6"/><text class="mt" x="815.0" y="441" text-anchor="middle">sysmon</text><text class="lbl" x="815.0" y="463" text-anchor="middle">M</text><text class="lbl" x="886" y="426" text-anchor="start">while the program is busy,</text><text class="lbl" x="886" y="446" text-anchor="start">wakes every 20 µs–10 ms</text><text class="lbl" x="886" y="466" text-anchor="start">takes Ps back from syscalls</text><text class="lbl" x="886" y="486" text-anchor="start">preempts after a 10 ms slice</text></g>
</svg>
